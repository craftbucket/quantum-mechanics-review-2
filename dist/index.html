<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程复习工作台 · 2026—2027-1</title>
<meta name="description" content="六门课程的知识卡、主动回忆、题库、错题本与内置思维导图">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home"><span class="brand-mark">⌘</span><span><b>课程复习工作台</b><small>REVIEW CONSOLE · 2026—2027-1</small></span></a>
  <nav class="nav" aria-label="主导航">
    <button data-view="home" class="nav-btn active">总览</button>
    <button data-view="learn" class="nav-btn">知识卡</button>
    <button data-view="bank" class="nav-btn">题库</button>
    <button data-view="maps" class="nav-btn">知识地图</button>
    <button data-view="mistakes" class="nav-btn">错题本 <em id="mistakeBadge">0</em></button>
    <button data-view="english" class="nav-btn">英语工作台</button>
  </nav>
  <div class="top-tools"><label class="global-search"><span>⌕</span><input id="globalSearch" placeholder="搜索知识点或题目" aria-label="搜索知识点或题目"><kbd>⌘K</kbd></label><button id="themeBtn" class="icon-btn" title="切换主题">◐</button><button id="backupBtn" class="icon-btn" title="导出学习记录">⇩</button></div>
</header>
<div class="app-shell">
  <aside class="rail">
    <div class="rail-title">我的学习空间</div>
    <div class="rail-stats"><span id="readCount">0</span><small>章已读</small><span id="masteredCount">0</span><small>题已掌握</small></div>
    <div class="rail-section"><div class="rail-label">课程筛选</div><div id="courseRail"></div></div>
    <div class="rail-tip"><span class="eyebrow">学习主线</span><strong>理解 → 回忆 → 练习</strong><p>开卷课记住查找路径，闭卷课把公式放进题目。</p></div>
    <div class="rail-foot"><span class="status-dot"></span>记录保存在此浏览器</div>
  </aside>
  <main id="app" tabindex="-1"></main>
</div>
<footer><span>课程复习工作台 · 近代物理实验按要求排除</span><a id="indexOpen" href="#" target="_blank">课程内容已内置于网站</a></footer>
<dialog id="practiceDialog" aria-labelledby="practiceTitle"></dialog>
<script src="data.js"></script><script src="app.js"></script>
</body>
</html>
